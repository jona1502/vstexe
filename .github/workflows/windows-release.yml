name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $version = "0.1.$env:GITHUB_RUN_NUMBER"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH; received $env:GITHUB_REF_NAME"
          }
          "VOCALCHAIN_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure release
        shell: pwsh
        run: >-
          cmake -S . -B build/windows-release-ci
          -G "Visual Studio 17 2022" -A x64
          "-DVOCALCHAIN_VERSION=$env:VOCALCHAIN_VERSION"
          -DVOCALCHAIN_BUILD_TESTS=ON
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build release
        shell: pwsh
        run: cmake --build build/windows-release-ci --config Release --parallel

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build/windows-release-ci -C Release --output-on-failure

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build setup executable
        shell: pwsh
        run: >-
          .\installer\windows\build-installer.ps1
          -Version $env:VOCALCHAIN_VERSION
          -BuildDirectory build/windows-release-ci

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VocalChain-${{ env.VOCALCHAIN_VERSION }}-Windows-x64
          path: out/windows/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem .\out\windows -File | Select-Object -ExpandProperty FullName
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $files --clobber
          } else {
            $notes = @"
          Windows x64 desktop installer and SHA-256 checksum.

          This preview contains the VocalChain desktop application. The virtual microphone
          kernel driver is not bundled until its release package has been signed by Microsoft.
          "@
            $notes | Set-Content .\out\windows\release-notes.md
            gh release create $env:GITHUB_REF_NAME $files `
              --verify-tag --title "VocalChain $env:VOCALCHAIN_VERSION" `
              --notes-file .\out\windows\release-notes.md --generate-notes
          }
